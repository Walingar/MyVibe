    <linearGradient id="waveTop" x1="270" y1="298" x2="665" y2="474" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F08BFF"/>
      <stop offset="0.34" stop-color="#C355FF"/>
      <stop offset="0.68" stop-color="#824BFF"/>
      <stop offset="1" stop-color="#4C47F4"/>
    </linearGradient>

    <linearGradient id="waveTopInner" x1="330" y1="320" x2="610" y2="435" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="white" stop-opacity="0.82"/>
      <stop offset="0.45" stop-color="white" stop-opacity="0.22"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
