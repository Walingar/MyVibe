      <stop offset="0.45" stop-color="white" stop-opacity="0.24"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <filter id="softShadow" x="180" y="220" width="650" height="520" filterUnits="userSpaceOnUse">
