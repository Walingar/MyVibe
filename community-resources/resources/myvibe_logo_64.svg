<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="bg" x1="140" y1="120" x2="884" y2="904" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111426"/>
      <stop offset="0.55" stop-color="#121B33"/>
      <stop offset="1" stop-color="#0E1530"/>
    </linearGradient>

    <radialGradient id="bgGlowTop" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(390 350) rotate(28) scale(360 260)">
      <stop offset="0" stop-color="#C94BFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#C94BFF" stop-opacity="0"/>
