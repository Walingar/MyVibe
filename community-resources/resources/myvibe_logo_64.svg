    <linearGradient id="waveBottom" x1="360" y1="505" x2="798" y2="705" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#93F6FF"/>
      <stop offset="0.34" stop-color="#54D9FF"/>
      <stop offset="0.66" stop-color="#2F9BFF"/>
