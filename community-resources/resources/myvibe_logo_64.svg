    <radialGradient id="bgGlowBottom" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(640 640) rotate(-22) scale(360 250)">
      <stop offset="0" stop-color="#3EDCFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3EDCFF" stop-opacity="0"/>
